# Verification for the GitHub mirror.
#
# GitLab (origin) remains the deployment gate: .gitlab-ci.yml owns build and
# deploy, and its `build` job needs every test job listed here. This workflow
# exists so a push or a pull request on the mirror is not unverified — until it
# was added, nothing on this side of the remote ran at all.
#
# The commands are deliberately identical to the GitLab jobs. If one changes,
# change both.
name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: server/go.sum
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server

  backend_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run test
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build and start the server
        run: |
          cd server && CGO_ENABLED=0 go build -o ../server-bin . && cd ..
          # LOCO_E2E=1 enables debug_set_state, which the suite is built on.
          PORT=8080 LOCO_E2E=1 ./server-bin &
          timeout 30 sh -c 'until wget -qO- http://localhost:8080/health; do sleep 1; done'
      - name: Install client deps (the Playwright webServer runs Vite)
        run: npm ci
        working-directory: client
      - name: Install e2e deps
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: 'true'
