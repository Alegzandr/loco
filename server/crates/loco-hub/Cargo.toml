[package]
name = "loco-hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The hub, the tables, the sockets, the drain and the snapshot."

[features]
# The WebSocket harness the socket-level tests stand on (`testkit`). Off in the
# binary; the crate's own tests turn it on through the self dev-dependency below.
testkit = ["dep:tokio-tungstenite"]

[dependencies]
loco-protocol.workspace = true
loco-game.workspace = true
axum.workspace = true
futures-util.workspace = true
ipnet.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
loco-hub = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
criterion.workspace = true

[[bench]]
name = "hub"
harness = false

[lib]
# The lib has no benchmarks of its own; without this `cargo bench` hands
# criterion's flags to the libtest harness, which refuses them.
bench = false

[lints]
workspace = true
