[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Every crate takes its versions from here. An agent that needs a dependency
# adds it to this table, never with a version in its own Cargo.toml.
[workspace.dependencies]
loco-game = { path = "crates/loco-game" }
loco-protocol = { path = "crates/loco-protocol" }
loco-janus = { path = "crates/loco-janus" }
loco-twitch = { path = "crates/loco-twitch" }
loco-hub = { path = "crates/loco-hub" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
rand_core = "0.9"
# The nickname matcher reads Unicode general categories (Mn, L*, Lu, Ll, Nd);
# std only exposes the derived properties.
unicode-general-category = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ipnet = "2"
subtle = "2"
ts-rs = "11"
schemars = "1"
dprint-plugin-typescript = "=0.95"
proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = "0.7"
# Added by the server crates (agent D).
httpdate = "1"
sha2 = "0.10"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
