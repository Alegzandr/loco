# cargo-deny: what the Rust server may depend on. Run by `make lint-server`
# and the `backend_lint_rs` CI job.
#
# The project is MIT and ships a binary to its own server, so the bar is
# "nothing copyleft, nothing unknown, nothing with an open advisory".

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here with the
# reason it does not apply.
ignore = [
    # smartstring is unmaintained. It is reached only through protocolgen's
    # TypeScript formatter (dprint → deno_ast → swc), a build-time tool that
    # writes client/src/types and never ships in the server image.
    { id = "RUSTSEC-2026-0249", reason = "build-time only, via protocolgen; not in loco-server" },
]

[licenses]
# Permissive licences only. A new one is a decision, made here, with a
# reason — never a blanket widening.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate is a warning, not a failure: the async ecosystem
# carries a few (tungstenite through axum, hashbrown), and failing on them
# would make every bump a negotiation with upstream.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
