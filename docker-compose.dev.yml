# Development compose — no host toolchain required.
# Changes to Go or TypeScript source are picked up automatically.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Endpoints:
#   Frontend (Vite):  http://localhost:5173
#   Backend  (Go):    http://localhost:8080
#   WebSocket:        ws://localhost:8080/ws  (browser connects directly — no Vite proxy)

services:
    server:
        image: golang:1.24.7-alpine
        working_dir: /app
        volumes:
            - ./server:/app
            # Cache Go module downloads across rebuilds.
            - go-mod-cache:/root/go/pkg/mod
        environment:
            - PORT=8080
            - GOFLAGS=-mod=mod
            - LOCO_E2E=1
        ports:
            - "8080:8080"
        command: go run .
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 5

    client:
        image: node:20-alpine
        working_dir: /app
        volumes:
            - ./client:/app
            # Isolate node_modules inside the container to avoid host/container conflicts.
            - client-node-modules:/app/node_modules
        environment:
            # Direct WebSocket port: browser connects to ws://<host>:8080/ws, bypassing Vite proxy.
            - VITE_WS_PORT=8080
            # HMR client port: must match the host-side Docker port mapping (5173→3000).
            # Without this, Vite injects HMR code pointing at container port 3000
            # (not exposed), causing spurious WS errors that obscure app WS failures.
            - VITE_HMR_CLIENT_PORT=5173
        ports:
            - "5173:3000"
        command: sh -c "npm ci && npm run dev"
        depends_on:
            server:
                condition: service_healthy
        restart: unless-stopped

volumes:
    go-mod-cache:
    client-node-modules:
