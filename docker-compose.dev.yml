# Development compose — no host toolchain required.
# Changes to Go or TypeScript source are picked up automatically.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Endpoints:
#   Frontend (Vite):  http://localhost:5173
#   Backend  (Go):    http://localhost:8080
#   WebSocket:        ws://localhost:8080/ws  (browser connects directly — no Vite proxy)

services:
    server:
        image: golang:1.26.5-alpine
        working_dir: /app
        volumes:
            - ./server:/app
            # Cache Go module downloads across rebuilds.
            - go-mod-cache:/root/go/pkg/mod
        environment:
            - PORT=8080
            - GOFLAGS=-mod=mod
            - LOCO_E2E=1
        ports:
            - "8080:8080"
        command: go run .
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 5

    client:
        # Astro 7 declares engines.node >= 22.12; the image is the current LTS.
        image: node:24-alpine
        working_dir: /app
        volumes:
            - ./client:/app
            # Isolate node_modules inside the container to avoid host/container conflicts.
            - client-node-modules:/app/node_modules
        environment:
            # Direct WebSocket port: browser connects to ws://<host>:8080/ws, bypassing Vite proxy.
            - VITE_WS_PORT=8080
            # HMR client port: must match the host-side Docker port mapping (5173→3000).
            # Without this, Vite injects HMR code pointing at container port 3000
            # (not exposed), causing spurious WS errors that obscure app WS failures.
            - VITE_HMR_CLIENT_PORT=5173
            # Where Vite forwards /live.json and /live-thumb/, which nginx
            # proxies in production. Inside this container localhost is this
            # container, so the service name is what reaches the Go server.
            - LOCO_SERVER_ORIGIN=http://server:8080
            # Watch by polling: /app is a bind mount, and a bind mount from a
            # Windows or macOS host delivers no inotify events, so hot reload
            # goes quiet without saying so and the browser keeps showing the
            # code that was on disk when the container booted. See the `watch`
            # option in client/astro.config.mjs.
            - LOCO_WATCH_POLL=1
        ports:
            - "5173:3000"
        # `.astro/dev.json` is Astro 7's dev-server lock, and it lives on the bind
        # mount, so it outlives the container that wrote it. Astro clears a stale
        # lock by asking whether its PID is still alive — a test that is meaningless
        # across a container restart, where PIDs begin again at 1 and the pid the
        # dead server recorded (43: npm's own child) is alive again on every boot.
        # The lock therefore never reads as stale, `astro dev` refuses to start,
        # `restart: unless-stopped` tries again, and the stack loops forever on a
        # server that has not existed since the last Ctrl+C. Dropping the lock here
        # is safe because this container is the only thing that can hold it.
        # `--force` is not: it would SIGKILL whatever now answers to that pid.
        command: sh -c "rm -f .astro/dev.json && npm ci && npm run dev"
        depends_on:
            server:
                condition: service_healthy
        restart: unless-stopped

volumes:
    go-mod-cache:
    client-node-modules:
