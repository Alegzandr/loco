# Development compose — no host toolchain required.
# Changes to Rust or TypeScript source are picked up automatically.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Endpoints:
#   Frontend (Vite):  http://localhost:5173
#   Backend  (Rust):  http://localhost:8080
#   WebSocket:        ws://localhost:8080/ws  (browser connects directly — no Vite proxy)

services:
    server:
        image: rust:1.99-bookworm
        working_dir: /app
        volumes:
            - ./server:/app
            # The crate registry and the build outside the bind mount: a
            # second start neither downloads the graph nor rebuilds it, and the
            # host's own server/target (if any) is not overwritten by Linux
            # artefacts.
            - cargo-registry:/usr/local/cargo/registry
            - cargo-target:/app/target
        environment:
            - PORT=8080
            - LOCO_E2E=1
        # Loopback only: this server runs with LOCO_E2E=1, so debug_set_state
        # rewrites any hand at any table. Published on every interface, that is
        # anybody on the LAN.
        ports:
            - "127.0.0.1:8080:8080"
        # `cargo watch` rebuilds and restarts on every save; the first build
        # takes a few minutes, which is what the healthcheck's retries wait for.
        command: sh -c "cargo install --locked cargo-watch && cargo watch -x 'run -p loco-server'"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "/app/target/debug/loco-server", "healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 60

    client:
        # Vite 8 and SvelteKit 3 declare engines.node >= 22.12; the image is the current LTS.
        image: node:24-alpine
        working_dir: /app
        volumes:
            - ./client:/app
            # Isolate node_modules inside the container to avoid host/container conflicts.
            - client-node-modules:/app/node_modules
        environment:
            # Direct WebSocket port: browser connects to ws://<host>:8080/ws, bypassing Vite proxy.
            - VITE_WS_PORT=8080
            # HMR client port: must match the host-side Docker port mapping (5173→3000).
            # Without this, Vite injects HMR code pointing at container port 3000
            # (not exposed), causing spurious WS errors that obscure app WS failures.
            - VITE_HMR_CLIENT_PORT=5173
            # Where Vite forwards /live.json and /live-thumb/, which nginx
            # proxies in production. Inside this container localhost is this
            # container, so the service name is what reaches the server.
            - LOCO_SERVER_ORIGIN=http://server:8080
            # Watch by polling: /app is a bind mount, and a bind mount from a
            # Windows or macOS host delivers no inotify events, so hot reload
            # goes quiet without saying so and the browser keeps showing the
            # code that was on disk when the container booted. See the `watch`
            # option in client/vite.config.ts.
            - LOCO_WATCH_POLL=1
        ports:
            - "5173:3000"
        # Vite takes no lock (Astro's did, and this line used to delete it), so
        # a restart is an ordinary restart. `npm ci` runs `prepare`, which is
        # `svelte-kit sync`: the generated types exist before the server starts.
        command: sh -c "npm ci && npm run dev"
        depends_on:
            server:
                condition: service_healthy
        restart: unless-stopped

volumes:
    cargo-registry:
    cargo-target:
    client-node-modules:
