services:
  server:
    image: ${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - app.env
    expose:
      - "8080"
    networks:
      - internal
    # This process needs no privilege it is not being given here. It listens on
    # a high port, reads no system path and writes one file. Dropping the rest
    # is what keeps a bug in a message handler from being anything more than a
    # bug in a message handler. The image already runs as uid 10001
    # (server/Dockerfile); these are the parts a Dockerfile cannot set.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # The single most important line in this file for anybody mid-match.
    # Docker's default is SIGTERM, wait 10s, SIGKILL, and the graceful
    # shutdown in server/main.go needs minutes, not ten seconds. Left at the
    # default, every match in flight is killed exactly the way it was before
    # any of the drain existed, and nothing would say so. Kept a minute above
    # LOCO_DRAIN_TIMEOUT so the snapshot write always fits inside it, and it
    # is also the real ceiling on how long a deploy can block: whatever is
    # being played, Docker stops waiting here.
    stop_grace_period: ${STOP_GRACE_PERIOD:-150s}
    volumes:
      # Where the shutdown parks the matches the drain could not finish, and
      # where the next container picks them up. A named path under DATA_DIR
      # rather than a volume so an operator can see, and delete, exactly one
      # file. See server/hub/snapshot.go.
      - ${DATA_DIR}/snapshots:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    image: ${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG}
    restart: unless-stopped
    # Only the flag that is free here. The stock nginx image starts as root to
    # bind :80 and then drops to the nginx user, and it writes its caches and
    # pid under /var, so `cap_drop: ALL` and `read_only` would both stop it
    # booting. Rewriting the image to run rootless is a separate change with its
    # own way of going wrong, and this container serves static files and proxies
    # a socket: the server behind it is where the state is.
    security_opt:
      - no-new-privileges:true
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - traefik
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.entrypoints=websecure
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.tls=true
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.service=${APP_SUBDOMAIN}-${DEPLOY_ENV}
      - traefik.http.services.${APP_SUBDOMAIN}-${DEPLOY_ENV}.loadbalancer.server.port=80
      # The direct socket host, resolved outside the CDN. It is the same nginx
      # and the same service — only the hostname differs, and nginx answers it
      # with the socket and a 404 for everything else (client/nginx.conf).
      #
      # `ws.${APP_HOST}` rather than a variable of its own: the host is declared
      # once, in .gitlab-ci.yml, and everything else is derived from it. The
      # router is created in every environment; only production points a DNS
      # record and a client bundle at it, so elsewhere it is inert.
      #
      # tls=true and no certresolver, like the router above: this Traefik has no
      # certificatesResolvers at all and reads certificates as files. That is
      # also the failure to recognise here — an origin serving Traefik's
      # self-signed default means the certificate for this hostname was never
      # installed, and the game answers it by falling back to the proxied path
      # rather than by breaking. See docs/deployment.md.
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ws.rule=Host(`ws.${APP_HOST}`)
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ws.entrypoints=websecure
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ws.tls=true
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ws.service=${APP_SUBDOMAIN}-${DEPLOY_ENV}

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
  internal:
    name: ${APP_SUBDOMAIN}-${DEPLOY_ENV}-internal
