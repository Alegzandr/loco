# The security headers, in a file of their own so they can be `include`d in
# every context that needs them.
#
# This is not tidiness, it is the fix for a real hole. nginx's `add_header` is
# inherited from an outer level *only while the inner level declares no
# add_header of its own*: one `add_header Cache-Control` inside a location block
# silently drops every header the server block set, for every response that
# block serves. `location /_astro/` did exactly that, so the entire JavaScript
# bundle and every optimised asset went out with no CSP, no nosniff, no
# Referrer-Policy and no Permissions-Policy — while the document response, which
# is all `tools/csp/check.mjs` used to look at, kept all four and reported clean.
#
# The bare-asset case that matters is nosniff: anything under /_astro/ that a
# browser can be talked into treating as a document is a document *with no
# policy at all*, on this origin. Astro emits optimised images there, SVG
# included, so navigating a victim straight to one is the shape of the attack.
# Nothing user-controlled lands in that directory today, which is what keeps
# this a latent hazard rather than a live exploit — and exactly why it is worth
# closing before something does.
#
# So: any location block here that declares an add_header must also include this
# file. `client/src/test/csp.test.ts` asserts that rule over the config text,
# because the failure is invisible in every other check.

# script-src has no 'unsafe-inline': index.html carries no inline script and the
# bundle is a module from this origin. style-src does, and cannot avoid it: the
# board is a fixed coordinate space and every card, seat and pile is placed by a
# style attribute, and Astro inlines the stylesheets.
#
# connect-src names ws/wss explicitly. A page served over http:// and a socket
# opened to ws:// are different origins as far as CSP is concerned, so 'self'
# alone would block the one connection the game is made of.
#
# $http_host, not $host: $host drops the port, and a CSP host source with no
# port means the scheme's default one. On :443 the two are identical, so the
# difference is invisible in production and blocks the socket everywhere else —
# a staging host on a non-default port, or anyone running the built image
# locally.
#
# __WS_DIRECT_ORIGIN__ is the hostname the socket dials to bypass the CDN, and
# it is a placeholder rather than a variable because there is nothing in a
# request to derive it from: it is a property of the deployment, not of the host
# being asked. `client/Dockerfile` substitutes it from the VITE_WS_ORIGIN
# build-arg — the same value the bundle is built with, so the policy and the
# socket cannot disagree — and leaves it empty everywhere it is not set, which
# is dev, a local build and the dev deployment. An empty substitution is a
# double space inside the directive, which CSP ignores.
#
# The same-origin ws:// and wss:// stay listed beside it. They are not leftovers:
# they are the fallback the client uses when the direct hostname will not open
# (webSocketPolicy.ts), and a policy that omitted them would turn a certificate
# expiry into a permanently dead game instead of a slow one.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host __WS_DIRECT_ORIGIN__; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Nothing here asks for a device. Saying so is what stops an injected script
# from asking on the page's behalf.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Every entrypoint that answers for this stack is `websecure`, so the only http
# request a player can make is one that never arrives — which is exactly the
# request this header is about. Without it, the *first* navigation of a session
# is plaintext and interceptable, and on this stack that first navigation is the
# one that hands out the bundle: an attacker on the path serves their own and
# the CSP above, which the same response carries, is theirs to write.
#
# It matters more here than on an ordinary site because of `ws.`. That hostname
# is deliberately outside the CDN, so nothing upstream is sending a policy on
# its behalf, and it is where the game's whole session — the seat token
# included — travels.
#
# No `includeSubDomains` and no `preload`: this origin has sibling names that
# nothing in this repository serves or can promise for, and both of those are
# commitments a header cannot take back. A year on the exact hosts answering
# here is the part that is ours to make.
add_header Strict-Transport-Security "max-age=31536000" always;
