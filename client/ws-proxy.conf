# The WebSocket proxy, in a file of its own because two server blocks serve it
# and they must not drift.
#
# One is the page's own host, which is where the socket used to live and where
# it still falls back to when the direct hostname will not open. The other is
# that direct hostname, whose whole purpose is to be resolved outside the CDN:
# measured Paris to Paris, a round trip on an established socket costs 8.5 ms
# direct and 389 ms proxied, and a game decided by arrival order cannot pay the
# second. See docs/deployment.md.
#
# Both send the same headers to the same upstream on purpose. A socket that
# reconnects onto the fallback must reach a server that cannot tell the
# difference, because the seat it is reclaiming was taken on the other one.
location /ws {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;

    # The Go server keys its two per-network ceilings on the player's network
    # (hub/privacy.go: clientNet), and behind a proxy every socket otherwise
    # arrives from this container's own address — one bucket for the whole
    # internet, which turns a 64-per-network limit into a 64-player server.
    #
    # Two headers because there are two paths, and **each host forwards only the
    # one its own path guarantees**. That is the whole of it, and it is a
    # security property rather than tidiness:
    #
    #   - CF-Connecting-IP is meaningful on the proxied path alone, because
    #     Cloudflare *sets* it there (which is why it and not X-Forwarded-For,
    #     whose leftmost entry Cloudflare only appends to and a client is free
    #     to invent).
    #   - X-Real-IP is meaningful on the direct path alone, where Traefik
    #     overwrites it with the peer it actually accepted.
    #
    # Forwarding both from both hosts was an address-spoofing hole. `ws.` is
    # grey-clouded by design — that is the entire point of it — so nothing on
    # that path sets or strips CF-Connecting-IP: a client wrote its own, nginx
    # passed it on, and the Go server believed it because the *peer* (this
    # container) is a trusted proxy. One forged header per socket therefore
    # bought a fresh network key per socket, which is every per-network ceiling
    # in the server at once: MaxConnsPerNet (64), and the wrong-code budget that
    # is the only thing rationing a sweep of the table-code space.
    #
    # So the value comes from a variable each server block sets for itself, and
    # a variable that resolves to the empty string makes nginx omit the header
    # entirely — which lands the request on hub/privacy.go's fallback (the peer),
    # the honest answer when there is nothing trustworthy to read.
    #
    # If a host ever gains a second trustworthy path, give it a `set` — never a
    # third `proxy_set_header` here. csp.test.ts fails on a literal $http_ in
    # this file for that reason.
    proxy_set_header CF-Connecting-IP $loco_cf_ip;
    proxy_set_header X-Real-IP $loco_real_ip;

    proxy_connect_timeout 10s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # An interrupt is decided by arrival order at the server, so every hop
    # on this path must forward a frame the instant it has it.
    # tcp_nodelay: disable Nagle on the upgraded tunnel. Without it the
    #   kernel can hold a small frame (every gameplay message is small)
    #   waiting for more data to fill a segment: up to 40ms of pure,
    #   invisible delay added to a card play.
    # proxy_buffering off: never accumulate upstream bytes before passing
    #   them on; a broadcast must not wait on a buffer nginx wants filled.
    tcp_nodelay on;
    proxy_buffering off;
    proxy_request_buffering off;
}
