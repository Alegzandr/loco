# The WebSocket proxy, in a file of its own because two server blocks serve it
# and they must not drift.
#
# One is the page's own host, which is where the socket used to live and where
# it still falls back to when the direct hostname will not open. The other is
# that direct hostname, whose whole purpose is to be resolved outside the CDN:
# measured Paris to Paris, a round trip on an established socket costs 8.5 ms
# direct and 389 ms proxied, and a game decided by arrival order cannot pay the
# second. See docs/deployment.md.
#
# Both send the same headers to the same upstream on purpose. A socket that
# reconnects onto the fallback must reach a server that cannot tell the
# difference, because the seat it is reclaiming was taken on the other one.
location /ws {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;

    # The Go server keys its two per-network ceilings on the player's network
    # (hub/privacy.go: clientNet), and behind a proxy every socket otherwise
    # arrives from this container's own address — one bucket for the whole
    # internet, which turns a 64-per-network limit into a 64-player server.
    #
    # Two headers because there are two paths now. CF-Connecting-IP is the
    # proxied one: Cloudflare *sets* it, which is why it and not
    # X-Forwarded-For, whose leftmost entry Cloudflare only appends to and a
    # client is free to invent. X-Real-IP is the direct one, where there is no
    # CDN and Traefik is the thing that overwrites it with the real peer.
    # Both are already forwarded untouched by nginx; naming them keeps the
    # dependency visible in the block that carries it.
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $http_x_real_ip;

    proxy_connect_timeout 10s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # An interrupt is decided by arrival order at the server, so every hop
    # on this path must forward a frame the instant it has it.
    # tcp_nodelay: disable Nagle on the upgraded tunnel. Without it the
    #   kernel can hold a small frame (every gameplay message is small)
    #   waiting for more data to fill a segment: up to 40ms of pure,
    #   invisible delay added to a card play.
    # proxy_buffering off: never accumulate upstream bytes before passing
    #   them on; a broadcast must not wait on a buffer nginx wants filled.
    tcp_nodelay on;
    proxy_buffering off;
    proxy_request_buffering off;
}
