<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Loco – Real-time Card Game</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Pre-hydration backdrop: matches the light-theme canvas so there is no
         white flash before tokens.css applies. Dark theme repaints on mount. */
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #ece3ff; }
      /* Prevent text selection and callout on long-press (mobile) */
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* Prevent double-tap zoom on interactive elements */
      button, input, select { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
