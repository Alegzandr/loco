# Production hosts invite indexing and point at the sitemap; dev hosts (`-d.`)
# refuse it outright. The `Sitemap:` line is absolute by requirement of the
# protocol, hence $scheme://$host rather than a path, and it is deliberately
# absent from the dev branch: advertising a sitemap on a host that disallows
# everything is a contradiction a crawler will report.
map $host $robots_txt {
    default "User-agent: *\nDisallow:\n\nSitemap: https://$host/sitemap-index.xml\n";
    ~*-d\. "User-agent: *\nDisallow: /\n";
}

# nginx's default access log writes the visitor's full IP, and this game asks
# for no account, sets no cookie and stores nothing, so that line was the single
# largest piece of personal data the whole stack held. It is reduced to the
# network prefix here, exactly as the Go server does for its own lines
# (hub/privacy.go: truncateAddr), and for the same reason: an operator reads
# these to tell two networks apart, never to identify a person.
#
# The referer and the user agent are dropped along with the host identifier.
# Neither answers an operational question here, and a user agent string is a
# fingerprint on its own.
map $remote_addr $remote_net {
    ~^(?<ipv4net>\d+\.\d+\.\d+)\.\d+$              "$ipv4net.0/24";
    ~^(?<ipv6net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  "$ipv6net::/48";
    default                                        "unknown";
}

log_format anonymised '$remote_net $time_local "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anonymised;

    # The app bundle is ~360 KB of JavaScript and the pages are text: both
    # compress to a fraction of that, and nothing was compressing them. Images
    # and fonts are left out on purpose — webp and woff2 are already compressed,
    # so a second pass costs CPU per request and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Security headers. The client was already built to live under a closed CSP
    # — fonts are self-hosted via @fontsource, no CDN, no analytics, no remote
    # anything — but nothing was sending one, so the policy existed only as a
    # design rule. `always` so they ride error responses too.
    #
    # script-src has no 'unsafe-inline': index.html carries no inline script and
    # the bundle is a module from this origin. style-src does, and cannot avoid
    # it: index.html has a pre-hydration <style> block and framer-motion writes
    # inline style attributes on every animated node.
    #
    # connect-src names ws/wss explicitly. A page served over http:// and a
    # socket opened to ws:// are different origins as far as CSP is concerned,
    # so 'self' alone would block the one connection the game is made of.
    #
    # $http_host, not $host: $host drops the port, and a CSP host source with no
    # port means the scheme's default one. On :443 the two are identical, so the
    # difference is invisible in production and blocks the socket everywhere
    # else — a staging host on a non-default port, or anyone running the built
    # image locally.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing here asks for a device. Saying so is what stops an injected script
    # from asking on the page's behalf.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Proxy WebSocket connections to the backend
    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # An interrupt is decided by arrival order at the server, so every hop
        # on this path must forward a frame the instant it has it.
        # tcp_nodelay: disable Nagle on the upgraded tunnel. Without it the
        #   kernel can hold a small frame (every gameplay message is small)
        #   waiting for more data to fill a segment: up to 40ms of pure,
        #   invisible delay added to a card play.
        # proxy_buffering off: never accumulate upstream bytes before passing
        #   them on; a broadcast must not wait on a buffer nginx wants filled.
        tcp_nodelay on;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check for backend
    location /health {
        proxy_pass http://server:8080/health;
    }

    # Prevent indexing on dev (-d) hosts
    location = /robots.txt {
        default_type text/plain;
        return 200 $robots_txt;
    }

    # Hashed build output never changes under its name, so it can be cached for
    # a year. Everything else is content: a short cache keeps a redeploy visible
    # without asking the browser to re-fetch the whole page every navigation.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The site is a set of real pages, not one app behind a catch-all. Serving
    # index.html for an unknown URL answers 200 to a crawler asking about a page
    # that does not exist — a soft 404, which Google reports as an error and
    # which hides genuine broken links from everyone else.
    #
    # Astro builds directories, so `$uri/` is what resolves `/fr` to
    # `/fr/index.html`. Both spellings therefore answer 200; the canonical link
    # in every page names the slashed form, which is what stops them competing
    # as duplicates. A redirect here would be the other way to fix it and is a
    # trap: `/nope` has no directory either, so redirecting on the miss sends
    # `/nope` to `/nope/` to `/nope//` forever.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
