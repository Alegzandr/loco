# Production hosts invite indexing and point at the sitemap; dev hosts (`-d.`)
# refuse it outright. The `Sitemap:` line is absolute by requirement of the
# protocol, hence $scheme://$host rather than a path, and it is deliberately
# absent from the dev branch: advertising a sitemap on a host that disallows
# everything is a contradiction a crawler will report.
map $host $robots_txt {
    default "User-agent: *\nDisallow:\n\nSitemap: https://$host/sitemap-index.xml\n";
    ~*-d\. "User-agent: *\nDisallow: /\n";
}

# nginx's default access log writes the visitor's full IP, and this game asks
# for no account, sets no cookie and stores nothing, so that line was the single
# largest piece of personal data the whole stack held. It is reduced to the
# network prefix here, exactly as the Go server does for its own lines
# (hub/privacy.go: truncateAddr), and for the same reason: an operator reads
# these to tell two networks apart, never to identify a person.
#
# The referer and the user agent are dropped along with the host identifier.
# Neither answers an operational question here, and a user agent string is a
# fingerprint on its own.
map $remote_addr $remote_net {
    ~^(?<ipv4net>\d+\.\d+\.\d+)\.\d+$              "$ipv4net.0/24";
    ~^(?<ipv6net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  "$ipv6net::/48";
    default                                        "unknown";
}

log_format anonymised '$remote_net $time_local "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anonymised;

    # What this host can vouch for about the player's address, and nothing else.
    # See ws-proxy.conf, which reads both and is shared with the direct-socket
    # block below.
    #
    # This is the proxied host: every request reaches it through Cloudflare,
    # which sets CF-Connecting-IP itself and overwrites whatever the client
    # wrote. X-Real-IP is emptied because on this path nobody downstream of the
    # browser owns it, so forwarding it would let a client name its own network
    # the moment CF-Connecting-IP is missing or unparseable.
    set $loco_cf_ip $http_cf_connecting_ip;
    set $loco_real_ip "";

    # The app bundle is ~360 KB of JavaScript and the pages are text: both
    # compress to a fraction of that, and nothing was compressing them. Images
    # and fonts are left out on purpose — webp and woff2 are already compressed,
    # so a second pass costs CPU per request and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Security headers. The client was already built to live under a closed CSP
    # — fonts are self-hosted via @fontsource, no CDN, no analytics, no remote
    # anything — but nothing was sending one, so the policy existed only as a
    # design rule. `always` so they ride error responses too.
    #
    # They live in their own file because add_header does not merge: a location
    # block that declares one of its own inherits *none* of these. Every block
    # below that sets a header includes this same file, and csp.test.ts fails on
    # one that does not. The full reasoning is in security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # Proxy WebSocket connections to the backend. Shared with the direct-socket
    # server block at the bottom of this file, so it lives in its own include.
    include /etc/nginx/ws-proxy.conf;

    # /health is deliberately NOT proxied.
    #
    # It answers with the live room count, the connected-player count, the
    # uptime and whether a deploy is in progress. None of that is anybody's
    # business from the internet: the counts size the server for whoever is
    # thinking about loading it, and `draining` announces the window in which
    # new tables are refused. It is an operator surface, exactly like /metrics.
    #
    # Nothing legitimate needed it here. Docker's healthcheck runs *inside* the
    # server container against localhost:8080, and the CI smoke test does the
    # same. To read it on a running stack:
    #   docker compose exec server wget -qO- http://localhost:8080/health

    # Prevent indexing on dev (-d) hosts
    location = /robots.txt {
        default_type text/plain;
        return 200 $robots_txt;
    }

    # Hashed build output never changes under its name, so it can be cached for
    # a year. Everything else is content: a short cache keeps a redeploy visible
    # without asking the browser to re-fetch the whole page every navigation.
    #
    # The include is not optional and not decoration: declaring Cache-Control
    # here discards every header the server block set, so without it the whole
    # bundle ships with no CSP and no nosniff.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The site is a set of real pages, not one app behind a catch-all. Serving
    # index.html for an unknown URL answers 200 to a crawler asking about a page
    # that does not exist — a soft 404, which Google reports as an error and
    # which hides genuine broken links from everyone else.
    #
    # Astro builds directories, so `$uri/` is what resolves `/fr` to
    # `/fr/index.html`. Both spellings therefore answer 200; the canonical link
    # in every page names the slashed form, which is what stops them competing
    # as duplicates. A redirect here would be the other way to fix it and is a
    # trap: `/nope` has no directory either, so redirecting on the miss sends
    # `/nope` to `/nope/` to `/nope//` forever.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# The direct socket host.
#
# It exists because a proxied WebSocket cost 389 ms per round trip against 8.5 ms
# direct, measured on an established connection between two Paris networks. Only
# the socket leaves the CDN: the HTML, the bundle and the images all still want
# the edge and the cache, so this block serves the socket and nothing else.
#
# `ws.*` rather than a hostname, because production is declared once, in
# .gitlab-ci.yml, and deploy/compose.yml derives the router from it. nginx picks
# the first `listen 80` server as the default, which is the block above, so a
# request for the site's own host never reaches this one and a request for
# ws.<anything> never reaches the site.
#
# Everything that is not the socket answers 404 on purpose. Serving the SPA here
# too would publish the whole site a second time under a second hostname, and
# the canonical is the only thing that would have argued otherwise.
server {
    listen 80;
    server_name ws.*;

    access_log /var/log/nginx/access.log anonymised;

    # The mirror image of the pair on the site's host, and the reason they are
    # per-block at all.
    #
    # This hostname is grey-clouded: it resolves straight to the origin, so
    # Cloudflare is not on this path and CF-Connecting-IP is whatever the client
    # decided to send. It is dropped here rather than forwarded, which is what
    # closes it — the Go server reads the headers in order and would otherwise
    # take a forged one over the real address every time, handing every socket a
    # network key of its own and with it a private copy of every per-network
    # ceiling. X-Real-IP is the one Traefik overwrites on this path, so it is
    # the one that travels.
    set $loco_cf_ip "";
    set $loco_real_ip $http_x_real_ip;

    include /etc/nginx/security-headers.conf;
    include /etc/nginx/ws-proxy.conf;

    location / {
        return 404;
    }
}
