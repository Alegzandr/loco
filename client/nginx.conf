map $host $robots_txt {
    default "User-agent: *\nDisallow:\n";
    ~*-d\. "User-agent: *\nDisallow: /\n";
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The client was already built to live under a closed CSP
    # — fonts are self-hosted via @fontsource, no CDN, no analytics, no remote
    # anything — but nothing was sending one, so the policy existed only as a
    # design rule. `always` so they ride error responses too.
    #
    # script-src has no 'unsafe-inline': index.html carries no inline script and
    # the bundle is a module from this origin. style-src does, and cannot avoid
    # it: index.html has a pre-hydration <style> block and framer-motion writes
    # inline style attributes on every animated node.
    #
    # connect-src names ws/wss explicitly. A page served over http:// and a
    # socket opened to ws:// are different origins as far as CSP is concerned,
    # so 'self' alone would block the one connection the game is made of.
    #
    # $http_host, not $host: $host drops the port, and a CSP host source with no
    # port means the scheme's default one. On :443 the two are identical, so the
    # difference is invisible in production and blocks the socket everywhere
    # else — a staging host on a non-default port, or anyone running the built
    # image locally.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing here asks for a device. Saying so is what stops an injected script
    # from asking on the page's behalf.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Proxy WebSocket connections to the backend
    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # An interrupt is decided by arrival order at the server, so every hop
        # on this path must forward a frame the instant it has it.
        # tcp_nodelay: disable Nagle on the upgraded tunnel. Without it the
        #   kernel can hold a small frame (every gameplay message is small)
        #   waiting for more data to fill a segment: up to 40ms of pure,
        #   invisible delay added to a card play.
        # proxy_buffering off: never accumulate upstream bytes before passing
        #   them on; a broadcast must not wait on a buffer nginx wants filled.
        tcp_nodelay on;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check for backend
    location /health {
        proxy_pass http://server:8080/health;
    }

    # Prevent indexing on dev (-d) hosts
    location = /robots.txt {
        default_type text/plain;
        return 200 $robots_txt;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
