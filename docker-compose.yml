services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        environment:
            - PORT=${PORT:-8080}
        ports:
            - "${PORT:-8080}:8080"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 3

    client:
        build:
            context: ./client
            dockerfile: Dockerfile
        ports:
            - "${CLIENT_PORT:-3000}:80"
        depends_on:
            server:
                condition: service_healthy
        restart: unless-stopped
