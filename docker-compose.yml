services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        environment:
            - PORT=${PORT:-8080}
            # Short so `docker compose down` on a local stack is not a wait.
            # Production sets minutes (see deploy/app.env); the mechanism is the
            # same one either way, which is the point of running it here at all.
            - LOCO_DRAIN_TIMEOUT=${LOCO_DRAIN_TIMEOUT:-5s}
        # Long enough for the 5s drain above plus the shutdown itself. At
        # Docker's 10s default a drain that used its whole budget would be
        # SIGKILLed while closing.
        stop_grace_period: 20s
        # Not published, exactly like deploy/compose.yml: the browser reaches
        # this server through nginx (/ws, /live.json, /live-thumb/; never /health
        # or /metrics) and never directly, so a host port would only put /metrics
        # and /health on the LAN. The image has no shell to read it from, so
        # publish a port by hand (`ports: ["127.0.0.1:8080:8080"]`) when you
        # need /metrics locally.
        expose:
            - "8080"
        restart: unless-stopped
        # Same hardening as deploy/compose.yml, so the local stack is the one
        # that ships. See there for why nginx gets only the first of these.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp
        # Distroless: no wget, so the binary checks itself (`loco-server healthcheck`).
        healthcheck:
            test: ["CMD", "/loco-server", "healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 3

    client:
        build:
            context: ./client
            dockerfile: Dockerfile
        ports:
            - "${CLIENT_PORT:-3000}:80"
        depends_on:
            server:
                condition: service_healthy
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
