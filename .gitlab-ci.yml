image: docker:29

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  # The *name* of the stack, not its address: the compose project, the Traefik
  # router, the internal network and the deploy directory are all built from it.
  # It stayed `loco` when production moved to its own domain, which is why the
  # two hosts below are variables of their own instead of being derived from it.
  APP_SUBDOMAIN: loco
  # The two addresses, each stated once. Production has its own domain;
  # development is still a subdomain of the personal one, and it must keep the
  # `-d.` prefix — `client/nginx.conf` keys `robots.txt` on that exact pattern,
  # so a dev host renamed without it would invite indexing.
  PROD_HOST: ohloco.com
  DEV_HOST: loco-d.kisukesaama.com
  # The one switch deciding whether a push to `develop` reaches loco-d. Set it to
  # "false" in Settings > CI/CD > Variables to stop deploying on every push, or
  # pick it in the "Run pipeline" form for a single run. It gates `deploy_dev`
  # only: `build` still runs and still pushes the images, so the deploy stays one
  # manual click away instead of needing another pipeline. Nothing about prod
  # reads it — a `v*` tag deploys whatever this says.
  DEPLOY_DEV:
    value: "true"
    options:
      - "true"
      - "false"
    description: "Deploy develop to loco-d automatically. false leaves deploy_dev as a manual job."
  DOCKER_HOST: unix:///var/run/docker.sock
  # GitLab can only cache paths inside the project directory, so both toolchains
  # are pointed at one. Without this every job re-downloads the Go module graph
  # and every npm dependency from the network on each push.
  GOPATH: $CI_PROJECT_DIR/.gocache/path
  GOMODCACHE: $CI_PROJECT_DIR/.gocache/mod
  GOCACHE: $CI_PROJECT_DIR/.gocache/build
  npm_config_cache: $CI_PROJECT_DIR/.npm
  # npm's own progress rendering and audit/funding round trips are pure latency
  # in a non-interactive job.
  NPM_FLAGS: --prefer-offline --no-audit --no-fund

# ──────────────────────────────────────────────────────────────────
# Test jobs — run on every push, no Docker/registry required
# ──────────────────────────────────────────────────────────────────

backend_lint:
  stage: test
  image: golangci/golangci-lint:v2.12-alpine
  tags:
    - devops
  variables:
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.golangci-cache
  # Its own cache key rather than backend_test's: the two run concurrently, and
  # two jobs pushing one key race on the upload — the loser's entry is what the
  # next pipeline restores. The analysis cache is also most of what this job
  # spends its time rebuilding.
  cache:
    - key:
        prefix: golangci
        files:
          - server/go.sum
      paths:
        - .gocache/
        - .golangci-cache/
  script:
    - cd server && golangci-lint run ./...

protocol_check:
  stage: test
  image: golang:1.26.5-alpine
  tags:
    - devops
  # The client's protocol types and validation schemas are generated from
  # server/protocol. This regenerates them and fails if the result differs from
  # what is committed, which is the whole reason the generator is worth having:
  # without it, generation is a suggestion and the two files drift back into
  # being hand-maintained copies the moment somebody edits one directly.
  #
  # No cache on purpose. The generator is stdlib-only and compiles in about a
  # second, and a third job pushing a Go cache key would race the two that
  # already do (see backend_lint's note).
  script:
    - cd server && go run ./cmd/protocolgen -src protocol -out ../client/src/types -check

backend_test:
  stage: test
  image: golang:1.26.5-alpine
  tags:
    - devops
  cache:
    - key:
        prefix: go
        files:
          - server/go.sum
      paths:
        - .gocache/
    # The binary reaches e2e_test through the cache, not through `artifacts:`.
    # This runner cannot upload artifacts at all: its helper container resolves
    # the API host (`http://gitlab`) against the LAN DNS, which does not know
    # that name, so the upload dies with `no such host` and takes the job with
    # it. The cache has no such problem: it is a tarball on the runner's own
    # disk ("cache will not be downloaded from shared cache server").
    #
    # Keyed per branch, not per commit: a per-SHA key would leave one ~15 MB
    # cache volume behind on the runner for every push, and nothing ever
    # collects those. Correctness comes from server-bin.sha instead: e2e_test
    # rebuilds unless the cached binary was built from the commit it is testing,
    # which also covers two pipelines racing on the same branch.
    # `policy: push` because there is nothing here worth restoring.
    - key: server-bin-$CI_COMMIT_REF_SLUG
      policy: push
      paths:
        - server-bin
        - server-bin.sha
  script:
    # -race, which is why gcc is installed: this server is one event loop plus a
    # goroutine per socket, so a data race here is not a lint finding, it is the
    # hidden-state guarantee coming apart under load. The suite passed for months
    # with a real one in it — Hub.Stop closed a channel and returned, leaving
    # every caller running alongside a loop that was still dispatching — and it
    # was invisible for exactly one reason: nothing ever passed the flag.
    #
    # One run rather than two. The instrumented binary is not the one that ships,
    # but this suite is dominated by real sleeps and reaction windows rather than
    # by CPU, so -race costs it about two seconds; paying that twice to keep an
    # uninstrumented gate would buy nothing this job can actually observe.
    - apk add --no-cache gcc musl-dev
    - cd server && go test -race ./...
    # Built here, not in e2e_test: that job runs on the Playwright image, which
    # has no Go, and used to download a 70 MB toolchain tarball on every push to
    # produce this same binary. Static so it runs on the Playwright image as-is:
    # CGO_ENABLED=0 explicitly, because the -race run above turned cgo on.
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../server-bin .
    - echo "$CI_COMMIT_SHA" > ../server-bin.sha

frontend_test:
  stage: test
  # Astro 7 declares engines.node >= 22.12; the image is the current LTS.
  image: node:24-alpine
  tags:
    - devops
  cache:
    - key:
        prefix: npm-client
        files:
          - client/package-lock.json
      paths:
        - .npm/
  script:
    - cd client
    - npm ci $NPM_FLAGS
    - npm run lint
    - npm run test
    - npm run build

e2e_test:
  stage: test
  # The image ships the browsers, and it ships only the ones its own Playwright
  # needs, so the tag and e2e/package-lock.json are one decision, not two.
  # Declared once here and asserted below, because getting it wrong reports as
  # "Executable doesn't exist at /ms-playwright/chromium_headless_shell-…",
  # which names neither of the two files that have to change.
  variables:
    PLAYWRIGHT_VERSION: "1.62.1"
  image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-jammy
  tags:
    - devops
  # The tests run sequentially inside a job (the suite is stateful, so
  # `workers` stays at 1); sharding is what parallelises them. `fullyParallel:
  # true` in playwright.config.ts is what makes the split even — sharding whole
  # spec files instead gave 27/39/0/21, one job running empty.
  #
  # This is only a win if the runner accepts concurrent jobs — with
  # `concurrent = 1` in the runner's config.toml the shards queue behind each
  # other and pay four setups for the same work.
  parallel: 4
  # backend_test alone: it is what fills the server-bin cache below.
  # frontend_test is deliberately not in this list, because nothing here uses its
  # output, so naming it only parked the longest job in the pipeline behind it.
  # The `build` job still needs every test job, so a red unit test can never
  # ship. `artifacts: false` because this runner cannot pass artifacts at all
  # (see backend_test).
  needs:
    - job: backend_test
      artifacts: false
  cache:
    # Keyed per shard: four jobs sharing one cache key race each other on the
    # upload, and the loser's entry is the one the next pipeline restores.
    - key:
        prefix: npm-e2e-$CI_NODE_INDEX
        files:
          - client/package-lock.json
          - e2e/package-lock.json
      paths:
        - .npm/
    - key: server-bin-$CI_COMMIT_REF_SLUG
      policy: pull
      paths:
        - server-bin
        - server-bin.sha
  script:
    # LOCO_E2E=1 enables debug_set_state. The bot think delay is shortened from
    # 1.2–2.2 s to 0.25–0.45 s: it is dead time no test races (see
    # hub.ApplyBotTimingEnv). Reaction windows — catch, declaration, interrupt —
    # keep their shipped timing, because tests are meant to be able to win them.
    #
    # The cache normally carries backend_test's binary. A restore is best-effort
    # by design (a miss is a warning, not an error) and the branch key means the
    # entry can also belong to another commit, so the shard verifies the stamp
    # and rebuilds rather than trusting what it found. Testing a binary from a
    # different commit is the one failure this must not have: it would report on
    # code nobody pushed. This is the path the whole job took before, on every
    # push; it is now the exception.
    - |
      if [ ! -s server-bin ] || [ "$(cat server-bin.sha 2>/dev/null)" != "$CI_COMMIT_SHA" ]; then
        echo "no server-bin for $CI_COMMIT_SHA in the cache, rebuilding it"
        curl -fsSL https://go.dev/dl/go1.26.5.linux-amd64.tar.gz | tar -C /usr/local -xz
        (cd server && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 /usr/local/go/bin/go build -o ../server-bin .)
      fi
    - chmod +x server-bin
    - PORT=8080 LOCO_E2E=1 LOCO_BOT_THINK_MS=250 LOCO_BOT_JITTER_MS=200 ./server-bin &
    - timeout 30 sh -c 'until wget -qO- http://localhost:8080/health; do sleep 1; done'
    # Client deps: Playwright's `webServer` starts Vite from client/ on :4173.
    - cd client && npm ci $NPM_FLAGS && cd ..
    # No `playwright install`: this image ships the browsers already. That step
    # used to hide a drift instead of costing only time: `^1.52.0` in
    # package.json had resolved to 1.58.2 in the lockfile while the image stayed
    # on v1.52.0, and the download quietly fetched the missing browser on every
    # push. The dependency is now pinned exactly, and this asserts the pair
    # rather than letting the next drift surface as a missing executable.
    - cd e2e && npm ci $NPM_FLAGS
    - |
      installed="$(npx playwright --version | sed 's/^Version //')"
      if [ "$installed" != "$PLAYWRIGHT_VERSION" ]; then
        echo "Playwright $installed is installed, but this job runs on the v$PLAYWRIGHT_VERSION image," >&2
        echo "which ships only its own browsers. Set PLAYWRIGHT_VERSION in .gitlab-ci.yml and" >&2
        echo "@playwright/test in e2e/package.json to the same version, then commit the lockfile." >&2
        exit 1
      fi
    - CI=true npx playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  # No `artifacts:` here either, and this one costs something real: the JUnit
  # report (failing specs surfaced in the merge request) and the traces and
  # screenshots Playwright already writes to e2e/test-results/. A failed upload
  # fails the job, so with a runner that cannot reach the API those two lines
  # would turn a suite where all 122 tests passed into a red pipeline, strictly
  # worse than not collecting them. Restore the block below once the runner can
  # resolve the GitLab API host; nothing else has to change.
  #
  #  artifacts:
  #    when: always
  #    expire_in: 1 week
  #    reports:
  #      junit: e2e/playwright-results.xml
  #    paths:
  #      - e2e/test-results/

# ──────────────────────────────────────────────────────────────────
# Shared config for Docker build/deploy jobs
# ──────────────────────────────────────────────────────────────────

.defaults: &defaults
  tags:
    - devops
  image: docker:29
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set. Enable the GitLab container registry or set CI_REGISTRY to your registry host (e.g. gitlab.kisukesaama.com:5050)." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}}"
    - export APP_HOST="${DEV_HOST}"
    - if [[ -n "${CI_COMMIT_TAG:-}" ]]; then APP_HOST="${PROD_HOST}"; fi
    - set -a
    - source deploy/paths.env
    - set +a
    - |
      validate_paths() {
        if [[ -z "${DEPLOY_DIR:-}" || "${DEPLOY_DIR}" != /home/kisuke/* ]]; then
          echo "DEPLOY_DIR must stay under /home/kisuke" >&2
          exit 1
        fi
        if [[ -z "${DATA_DIR:-}" || "${DATA_DIR}" != /home/kisuke/* ]]; then
          echo "DATA_DIR must stay under /home/kisuke" >&2
          exit 1
        fi
      }
      write_app_env() {
        local target="$1"
        # The socket's certresolver travels as a whole label line rather than as
        # a value, because in dev the label must not exist at all. Production is
        # the only environment with a direct socket — it is the only one with a
        # CDN to escape — so it is the only one whose `ws.` hostname has a DNS
        # record. A dev router naming the resolver would have Traefik ask Let's
        # Encrypt for a certificate for a name that resolves nowhere, over and
        # over, against a quota of five failed validations an hour, and the
        # account it burns is the one production renews on.
        #
        # The dev value is an inert Docker label rather than an empty string:
        # Traefik reads nothing that does not start with `traefik.`, and an
        # empty entry in a compose `labels:` list does not parse.
        local ws_cert_label="loco.ws.certresolver=none"
        if [ "${DEPLOY_ENV}" = "prod" ]; then
          ws_cert_label="traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ws.tls.certresolver=letsencrypt"
        fi
        # The gateway credentials, and only production gets them.
        #
        # Two stacks on one key is two sets of requests against one quota, for a
        # list of live channels nobody reads on the dev host. An empty key
        # switches the whole feature off server-side — no goroutine, no request,
        # no message, not even a log line — which is exactly the contract an
        # empty LOCO_SNAPSHOT_PATH has. See docs/notes/live.md.
        #
        # `${VAR:-}` throughout: this script runs under `set -u`, and a variable
        # that is simply not defined on a dev pipeline must not abort the deploy.
        local janus_url="" janus_app="" janus_key="" twitch_game="" twitch_cdn=""
        if [ "${DEPLOY_ENV}" = "prod" ]; then
          janus_url="${JANUS_URL:-}"
          janus_app="${JANUS_APPLICATION_ID:-}"
          janus_key="${JANUS_API_KEY:-}"
          twitch_game="${LOCO_TWITCH_GAME_ID:-}"
          twitch_cdn="${LOCO_TWITCH_CDN_SLUG:-}"
        fi
        printf '%s\n' \
          "PORT=${PORT}" \
          "DEPLOY_ENV=${DEPLOY_ENV}" \
          "APP_HOST=${APP_HOST}" \
          "IMAGE_TAG=${IMAGE_TAG}" \
          "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}" \
          "LOCO_ALLOWED_ORIGINS=https://${APP_HOST}" \
          "LOCO_DRAIN_TIMEOUT=${LOCO_DRAIN_TIMEOUT}" \
          "STOP_GRACE_PERIOD=${STOP_GRACE_PERIOD}" \
          "LOCO_SNAPSHOT_PATH=${LOCO_SNAPSHOT_PATH}" \
          "WS_CERT_LABEL=${ws_cert_label}" \
          "JANUS_URL=${janus_url}" \
          "JANUS_APPLICATION_ID=${janus_app}" \
          "JANUS_API_KEY=${janus_key}" \
          "LOCO_TWITCH_GAME_ID=${twitch_game}" \
          "LOCO_TWITCH_CDN_SLUG=${twitch_cdn}" \
          > "${target}"
        # This file now carries a real secret. It did not before, which is
        # why nothing here had ever tightened it — unlike ${DATA_DIR}/snapshots,
        # which has been 0700 since it started holding session tokens.
        chmod 600 "${target}"
      }
      # How long a deploy waits for the matches already running is one policy
      # for every environment now, and it lives in deploy/app.env (90s drain,
      # 150s grace) rather than being switched per job here.
      #
      # Prod used to wait 15m so a best-of-7 could finish, which made the
      # length of a pipeline a function of how long strangers played. A job
      # that can sit for a quarter of an hour is a runner slot nobody else
      # gets, and it puts the pipeline one raised drain value away from
      # timing out on a match rather than on a fault. The snapshot is what
      # makes that trade affordable: whatever the 90s does not finish is
      # written to LOCO_SNAPSHOT_PATH and picked up by the next process, so
      # the players get the "Reconnexion" overlay a dropped wifi frame
      # already produces instead of losing the match. See
      # server/hub/snapshot.go.
      #
      # The server first, the client second, and never one `up -d` over both.
      #
      # Recreating the server is the slow half: it drains, and for as long as
      # it does, the players still in a match are talking to the OLD process.
      # Serving them the new client during that window would put a fresh
      # bundle against a server one version behind, for the whole length of
      # the drain. Doing the client afterwards narrows that mismatch to the
      # seconds between the two commands.
      rollout() {
        docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --env-file paths.env --env-file app.env -f compose.yml up -d --wait server
        docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --env-file paths.env --env-file app.env -f compose.yml up -d --wait client
      }
    - set -a
    - source deploy/app.env
    - set +a
    - validate_paths
    - mkdir -p "${DEPLOY_DIR}/dev" "${DEPLOY_DIR}/prod" "${DATA_DIR}" "${DATA_DIR}/snapshots"
    # The server container runs as uid 10001 (server/Dockerfile), so the bind
    # mount has to be writable by it: a mount overrides whatever the image
    # chowned. 0700 because this file carries session tokens and every hand in
    # every match that a deploy interrupted, and it lives on a host path an
    # operator can list. Failing to write it silently loses those matches, which
    # is exactly the failure the snapshot exists to prevent.
    - chown 10001:10001 "${DATA_DIR}/snapshots"
    - chmod 700 "${DATA_DIR}/snapshots"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"

# ──────────────────────────────────────────────────────────────────
# Docker image build — runs on develop branch and version tags
# ──────────────────────────────────────────────────────────────────

build:
  stage: build
  extends: .defaults
  # Every test job, not just the two unit ones. `needs` is what actually gates a
  # deploy: naming a subset lets build start the moment those finish, so the
  # lint and the entire Playwright suite were advisory — red on develop still
  # shipped to dev, and a version tag still shipped to prod. The two critical
  # bugs this list was widened for both lived in paths only e2e could have
  # walked.
  # Long form purely to say `artifacts: false`: this job gates on the test
  # results, not on their output, and the default would pull `server-bin` down
  # into a job that only builds images. Naming `e2e_test` waits on all four of
  # its parallel instances.
  needs:
    - job: backend_lint
      artifacts: false
    - job: protocol_check
      artifacts: false
    - job: backend_test
      artifacts: false
    - job: frontend_test
      artifacts: false
    - job: e2e_test
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - docker build -t "${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG}" -f server/Dockerfile server
    # The canonical, hreflang and og: tags are absolute and cannot be filled in
    # at runtime — crawlers do not run JS. Without this build-arg the client
    # falls back to the production origin, so the image built for
    # loco-d.kisukesaama.com served a canonical and an og:url naming production.
    # APP_HOST comes from .defaults and is already `-d.` on develop and the bare
    # host on a v* tag, which is exactly the distinction needed here.
    # The socket bypasses the CDN in production and only there. A proxied
    # WebSocket measured 389 ms per round trip against 8.5 ms direct, Paris to
    # Paris, on an established connection; dev has no such hostname, no DNS
    # record and no certificate for one, and does not have the problem either.
    # The same value fills the bundle and the CSP (client/Dockerfile), so an
    # empty one keeps both on the page's own origin exactly as before.
    - WS_ORIGIN=""
    - if [[ -n "${CI_COMMIT_TAG:-}" ]]; then WS_ORIGIN="wss://ws.${APP_HOST}"; fi
    - docker build --build-arg "VITE_PUBLIC_ORIGIN=https://${APP_HOST}" --build-arg "VITE_WS_ORIGIN=${WS_ORIGIN}" -t "${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG}" -f client/Dockerfile client
    - docker push "${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG}"
    - docker push "${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG}"

# ──────────────────────────────────────────────────────────────────
# Deploy jobs
# ──────────────────────────────────────────────────────────────────

deploy_dev:
  stage: deploy
  extends: .defaults
  needs: ["build"]
  # Comfortably above STOP_GRACE_PERIOD (150s) plus the two image pulls, and
  # stated rather than left to the instance default so the ceiling is visible
  # next to the wait it bounds. Nothing here scales with the number of tables.
  timeout: 10m
  # `DEPLOY_DEV != "true"` rather than `== "false"`: a variable someone typed
  # "0", "no" or an empty string into must not read as "deploy anyway", since the
  # whole point of this switch is to be able to stop a rollout. And it stays a
  # manual job rather than disappearing — the images are built either way, so the
  # deploy is one press on the pipeline, not another push.
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $DEPLOY_DEV != "true"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - export APP_HOST="${DEV_HOST}"
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}"
    - export DEPLOY_ENV=dev
    - TARGET_DIR="${DEPLOY_DIR}/dev"
    - cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
    - cp deploy/paths.env "${TARGET_DIR}/paths.env"
    - write_app_env "${TARGET_DIR}/app.env"
    - cd "${TARGET_DIR}"
    - rollout

stop_dev:
  stage: deploy
  extends: .defaults
  timeout: 10m
  rules:
    - when: manual
  script:
    - export APP_HOST="${DEV_HOST}"
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG:-dev}"
    - export DEPLOY_ENV=dev
    # `down` sends SIGTERM and honours stop_grace_period like any other stop,
    # so a manual stop waits on the tables that are up exactly as a deploy
    # does: 90s, then the snapshot.
    - TARGET_DIR="${DEPLOY_DIR}/dev"
    - mkdir -p "${TARGET_DIR}"
    - cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
    - cp deploy/paths.env "${TARGET_DIR}/paths.env"
    - write_app_env "${TARGET_DIR}/app.env"
    - cd "${TARGET_DIR}"
    - docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --env-file paths.env --env-file app.env -f compose.yml down

deploy_prod:
  stage: deploy
  extends: .defaults
  needs: ["build"]
  # Above STOP_GRACE_PERIOD (150s) plus the two image pulls, and stated rather
  # than left to the instance default. It was 30m while the drain was 15m,
  # which made the ceiling of a production pipeline a question about how long
  # a match runs. It is not one any more: the shutdown is bounded by the grace
  # period whatever is being played, and the snapshot carries the rest.
  timeout: 10m
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - export APP_HOST="${PROD_HOST}"
    - export IMAGE_TAG="${CI_COMMIT_TAG}"
    - export DEPLOY_ENV=prod
    - TARGET_DIR="${DEPLOY_DIR}/prod"
    - cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
    - cp deploy/paths.env "${TARGET_DIR}/paths.env"
    - write_app_env "${TARGET_DIR}/app.env"
    - cd "${TARGET_DIR}"
    - rollout
