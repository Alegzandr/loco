image: docker:27

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  APP_SUBDOMAIN: loco
  DOCKER_HOST: unix:///var/run/docker.sock

# ──────────────────────────────────────────────────────────────────
# Test jobs — run on every push, no Docker/registry required
# ──────────────────────────────────────────────────────────────────

backend_test:
  stage: test
  image: golang:1.24.7-alpine
  tags:
    - devops
  script:
    - cd server && go test ./...
    # Build a static binary for the E2E job (glibc-independent, works on Ubuntu)
    - cd server && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../server-bin .
  artifacts:
    paths:
      - server-bin
    expire_in: 1 hour

frontend_test:
  stage: test
  image: node:20-alpine
  tags:
    - devops
  script:
    - cd client
    - npm ci
    - npm run lint
    - npm run test
    - npm run build

e2e_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  tags:
    - devops
  needs:
    - job: backend_test
      artifacts: true
    - job: frontend_test
  script:
    # Start the Go server binary in the background
    - chmod +x server-bin
    - PORT=8080 ./server-bin &
    # Wait for the server to be ready
    - timeout 30 sh -c 'until wget -qO- http://localhost:8080/health; do sleep 1; done'
    # Install client dependencies so the webServer (Vite dev) can start
    - cd client && npm ci && cd ..
    # Install Playwright and run tests
    - cd e2e && npm ci
    - npx playwright install chromium
    - CI=true npx playwright test
  artifacts:
    when: always
    paths:
      - e2e/playwright-results.xml
      - e2e/playwright-report/
    reports:
      junit: e2e/playwright-results.xml
    expire_in: 1 week

# ──────────────────────────────────────────────────────────────────
# Shared config for Docker build/deploy jobs
# ──────────────────────────────────────────────────────────────────

.defaults: &defaults
  tags:
    - devops
  image: docker:27
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set. Enable the GitLab container registry or set CI_REGISTRY to your registry host (e.g. gitlab.kisukesaama.com:5050)." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}}"
    - export APP_HOST="${APP_SUBDOMAIN}-d.kisukesaama.com"
    - if [[ -n "${CI_COMMIT_TAG:-}" ]]; then APP_HOST="${APP_SUBDOMAIN}.kisukesaama.com"; fi
    - set -a
    - source deploy/paths.env
    - set +a
    - |
      validate_paths() {
        if [[ -z "${DEPLOY_DIR:-}" || "${DEPLOY_DIR}" != /home/kisuke/* ]]; then
          echo "DEPLOY_DIR must stay under /home/kisuke" >&2
          exit 1
        fi
        if [[ -z "${DATA_DIR:-}" || "${DATA_DIR}" != /home/kisuke/* ]]; then
          echo "DATA_DIR must stay under /home/kisuke" >&2
          exit 1
        fi
      }
      write_app_env() {
        local target="$1"
        printf '%s\n' \
          "PORT=${PORT}" \
          "DEPLOY_ENV=${DEPLOY_ENV}" \
          "APP_HOST=${APP_HOST}" \
          "IMAGE_TAG=${IMAGE_TAG}" \
          "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}" \
          > "${target}"
      }
    - set -a
    - source deploy/app.env
    - set +a
    - validate_paths
    - mkdir -p "${DEPLOY_DIR}/dev" "${DEPLOY_DIR}/prod" "${DATA_DIR}"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"

# ──────────────────────────────────────────────────────────────────
# Docker image build — runs on develop branch and version tags
# ──────────────────────────────────────────────────────────────────

build:
  stage: build
  extends: .defaults
  needs: ["backend_test", "frontend_test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - docker build -t "${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG}" -f server/Dockerfile server
    - docker build -t "${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG}" -f client/Dockerfile client
    - docker push "${CI_REGISTRY_IMAGE}/server:${IMAGE_TAG}"
    - docker push "${CI_REGISTRY_IMAGE}/client:${IMAGE_TAG}"

# ──────────────────────────────────────────────────────────────────
# Deploy jobs
# ──────────────────────────────────────────────────────────────────

deploy_dev:
  stage: deploy
  extends: .defaults
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - export APP_HOST="${APP_SUBDOMAIN}-d.kisukesaama.com"
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}"
    - export DEPLOY_ENV=dev
    - TARGET_DIR="${DEPLOY_DIR}/dev"
    - cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
    - cp deploy/paths.env "${TARGET_DIR}/paths.env"
    - write_app_env "${TARGET_DIR}/app.env"
    - cd "${TARGET_DIR}"
    - docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --env-file paths.env --env-file app.env -f compose.yml up -d

stop_dev:
  stage: deploy
  extends: .defaults
  rules:
    - when: manual
  script:
    - export APP_HOST="${APP_SUBDOMAIN}-d.kisukesaama.com"
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG:-dev}"
    - export DEPLOY_ENV=dev
    - TARGET_DIR="${DEPLOY_DIR}/dev"
    - mkdir -p "${TARGET_DIR}"
    - cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
    - cp deploy/paths.env "${TARGET_DIR}/paths.env"
    - write_app_env "${TARGET_DIR}/app.env"
    - cd "${TARGET_DIR}"
    - docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --env-file paths.env --env-file app.env -f compose.yml down

deploy_prod:
  stage: deploy
  extends: .defaults
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - export APP_HOST="${APP_SUBDOMAIN}.kisukesaama.com"
    - export IMAGE_TAG="${CI_COMMIT_TAG}"
    - export DEPLOY_ENV=prod
    - TARGET_DIR="${DEPLOY_DIR}/prod"
    - cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
    - cp deploy/paths.env "${TARGET_DIR}/paths.env"
    - write_app_env "${TARGET_DIR}/app.env"
    - cd "${TARGET_DIR}"
    - docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --env-file paths.env --env-file app.env -f compose.yml up -d
